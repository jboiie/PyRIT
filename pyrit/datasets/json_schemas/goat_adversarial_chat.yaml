type: object
description: >-
  Structured response from the GOAT (Generative Offensive Agent Tester)
  attacker. Field order matters here: GOAT section 3.2 makes reasoning
  (summarizing the defender's last response, then picking a strategy) happen
  before the attacker writes its next message, and structured-output APIs
  emit fields in schema order, so this schema orders the reasoning fields
  ahead of next_message -- unlike the shared adversarial_chat schema.
properties:
  last_response_summary:
    type: string
    description: >-
      A concise summary of the target's most recent response. Empty string
      when there is no prior response.
  rationale:
    type: string
    description: >-
      The attacker's reasoning, produced before next_message: how it
      interprets the target's last response, which strategy/strategies from
      the taxonomy it is picking, and how the next message will advance the
      objective.
  next_message:
    type: string
    description: >-
      The next adversarial prompt to send to the target model, written after
      the reasoning above. This is the only field consumed by the attack loop.
required:
  - last_response_summary
  - rationale
  - next_message
additionalProperties: false
